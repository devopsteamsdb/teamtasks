name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

concurrency:
  group: workflow-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y_%m_%d_%H_%M')" >> $GITHUB_OUTPUT

    - name: Login to dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push timestamped image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        tags: devopsteamsdb/devopsteamsdb:teamtasks_${{ steps.date.outputs.date }}
        push: true

    - name: Build and push latest image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        tags: devopsteamsdb/devopsteamsdb:teamtasks_latest
        push: true

    - name: Docker Save
      run: docker save devopsteamsdb/devopsteamsdb:teamtasks_${{ steps.date.outputs.date }} | gzip > teamtasks_${{ steps.date.outputs.date }}.gz

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.run_number }}
        name: Release teamtasks_${{ steps.date.outputs.date }}
        body: |
          Release teamtasks_${{ steps.date.outputs.date }}
        files: teamtasks_${{ steps.date.outputs.date }}.gz
